version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action/init and github/codeql-action/analyze are separate
      # "packages" for Dependabot but must run at the same version: init writes
      # a config file that analyze is required to understand. Ungrouped bumps
      # produce half-upgrades that always fail the analyze job.
      codeql-action:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
