name: SBOM migration spot check

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/sbom-migration-check.yml

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom:
    name: Verify migrated package SBOM attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Build package and SBOM
        run: |
          npm ci
          npm pack
          npm sbom --sbom-format cyclonedx > project-tendril-sbom.cdx.json

      - name: Attest package SBOM
        id: sbom
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        env:
          NODE_OPTIONS: '--max-http-header-size=32768'
        with:
          subject-path: project-tendril-*.tgz
          sbom-path: project-tendril-sbom.cdx.json

      - name: Verify signature, artifact digest, and CycloneDX predicate
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          gh attestation verify project-tendril-*.tgz \
            --repo gadgethd/Project-Tendril \
            --bundle "$SBOM_BUNDLE" \
            --predicate-type https://cyclonedx.org/bom \
            --format json > /tmp/tendril-sbom-verification.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const verified = JSON.parse(fs.readFileSync('/tmp/tendril-sbom-verification.json', 'utf8'));
          const sbom = JSON.parse(fs.readFileSync('project-tendril-sbom.cdx.json', 'utf8'));
          assert.ok(verified.length > 0, 'Expected a verified attestation');
          assert.deepStrictEqual(verified[0].verificationResult.statement.predicate, sbom);
          NODE
