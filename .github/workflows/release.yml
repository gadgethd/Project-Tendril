name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tag is a green main commit
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate tag and package version
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run release gates
        env:
          TENDRIL_ALLOW_NO_SANDBOX: "true"
        run: npm run check

      - name: Build package and SBOM
        run: |
          npm pack
          npm sbom --sbom-format cyclonedx > project-tendril-sbom.cdx.json
          sha256sum project-tendril-*.tgz project-tendril-sbom.cdx.json > SHA256SUMS

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/gadgethd/project-tendril
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish container
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: project-tendril-*.tgz

      - name: Attest package SBOM
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-path: project-tendril-*.tgz
          sbom-path: project-tendril-sbom.cdx.json

      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/gadgethd/project-tendril
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: project-tendril-${{ github.ref_name }}
          path: |
            project-tendril-*.tgz
            project-tendril-sbom.cdx.json
            SHA256SUMS
          if-no-files-found: error

      - name: Publish npm package through trusted publishing
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" project-tendril-*.tgz project-tendril-sbom.cdx.json SHA256SUMS --verify-tag --generate-notes --title "Project Tendril $GITHUB_REF_NAME"
