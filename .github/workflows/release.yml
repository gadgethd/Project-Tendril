name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Verify release
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Validate tag and package version
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build release archive
        run: |
          npm pack
          sha256sum project-tendril-*.tgz > SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: project-tendril-package
          path: |
            project-tendril-*.tgz
            SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" project-tendril-*.tgz SHA256SUMS --verify-tag --generate-notes --title "Project Tendril $GITHUB_REF_NAME"
