name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: ubuntu-latest
            node: 24.x
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Type-check
        run: npm run typecheck

      - name: Lint and verify formatting
        run: npm run lint && npm run format:check

      - name: Test
        # GitHub-hosted runners block parts of Chromium's sandbox on every OS:
        # Linux blocks the user namespaces Playwright's Chromium needs, Windows
        # cannot access the executable from the sandbox (sandbox_win.cc), and
        # macOS rejects the group probes used during cleanup. The Docker job
        # below verifies the real sandbox, so CI tests run with it disabled.
        env:
          TENDRIL_BROWSER_BACKEND: chromium
          TENDRIL_ALLOW_NO_SANDBOX: 'true'
        run: npm test

      - name: Test with coverage gates
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        env:
          TENDRIL_BROWSER_BACKEND: chromium
          TENDRIL_ALLOW_NO_SANDBOX: "true"
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Validate package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        run: npm run test:package

      - name: Audit dependencies and registry signatures
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        run: npm audit --audit-level=high && npm audit signatures

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  docker:
    name: Docker build and Obscura smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: project-tendril:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start hardened container
        run: docker run --detach --rm --name project-tendril-ci --publish 127.0.0.1:3210:3210 --read-only --tmpfs /tmp:rw,nosuid,nodev,size=1g --security-opt seccomp=seccomp_profile.json --cap-drop ALL --env TENDRIL_TOKEN=ci-token-for-project-tendril-smoke-test project-tendril:ci

      - name: Wait for health endpoint
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3210/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Exercise containerized Obscura
        run: |
          node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:3210';
          const headers = {
            authorization: 'Bearer ci-token-for-project-tendril-smoke-test',
            'content-type': 'application/json',
          };

          const created = await fetch(`${base}/v1/sessions`, {
            method: 'POST',
            headers,
            body: '{}',
          });
          if (!created.ok) throw new Error(await created.text());
          const session = await created.json();

          try {
            const content = await fetch(`${base}/v1/sessions/${session.id}/content`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ html: '<title>Container fixture</title><main><h1>Sandboxed Obscura</h1></main>' }),
            });
            if (!content.ok) throw new Error(await content.text());

            const snapshot = await fetch(`${base}/v1/sessions/${session.id}/snapshot`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ mode: 'full' }),
            });
            const body = await snapshot.text();
            if (!snapshot.ok || !body.includes('Sandboxed Obscura')) throw new Error(body);
            if (session.backend !== 'obscura' || session.cdpUrl !== undefined) throw new Error(JSON.stringify(session));
          } finally {
            await fetch(`${base}/v1/sessions/${session.id}`, {
              method: 'DELETE',
              headers,
            });
          }
          NODE

      - name: Scan image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: project-tendril:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Print container logs
        if: always()
        run: docker logs project-tendril-ci || true

      - name: Stop container
        if: always()
        run: docker stop project-tendril-ci || true

  required-browser-check:
    # Preserve the existing protected-branch context after the Docker backend
    # changed to Obscura. Both the Docker smoke and Chromium matrix must pass.
    name: Docker build and Chromium smoke test
    needs: [docker, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify both browser gates passed
        env:
          DOCKER_RESULT: ${{ needs.docker.result }}
          CHROMIUM_RESULT: ${{ needs.test.result }}
        run: test "$DOCKER_RESULT" = success && test "$CHROMIUM_RESULT" = success

  obscura:
    name: Obscura backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Obscura release
        run: |
          curl -fL https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.1/obscura-x86_64-linux-stealth.tar.gz -o /tmp/obscura.tar.gz
          echo '49856870420960ce489d2d1ff40fffac5b8c016604b9af0ded8ed6373abd9302  /tmp/obscura.tar.gz' | sha256sum -c -
          tar -xzf /tmp/obscura.tar.gz -C /tmp

      - name: Test the Rust browser backend
        env:
          TENDRIL_OBSCURA_PATH: /tmp/obscura
        run: npx vitest run tests/obscura.test.ts
