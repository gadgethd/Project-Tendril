name: Feature request
description: Propose an agent workflow or Project Tendril capability
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the agent workflow first. Requests for CAPTCHA solving, access-control bypass, hosted telemetry, or private-network access by default are outside Project Tendril's scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent or operator workflow cannot be completed today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the MCP/API behavior and an example call if possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Explain any new network, browser-profile, filesystem, credential, or untrusted-content access.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This request does not require bypassing a challenge or access control.
          required: true
